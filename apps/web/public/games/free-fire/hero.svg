<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="45%" stop-color="#0c0618"/>
      <stop offset="100%" stop-color="#12081f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0"/>
      <stop offset="50%" stop-color="#EF4444" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="orb" cx="70%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#F97316" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="1150" cy="320" rx="420" ry="320" fill="url(#orb)"/>
  <rect x="0" y="380" width="1600" height="140" fill="url(#glow)" filter="url(#blur)" opacity="0.7"/>
  <!-- geometric frame -->
  <path d="M80 120 L280 120 L280 140 L100 140 L100 280 L80 280 Z" fill="#EF4444" opacity="0.35"/>
  <path d="M1520 780 L1320 780 L1320 760 L1500 760 L1500 620 L1520 620 Z" fill="#F97316" opacity="0.35"/>
  <!-- abstract operator figure (generic, non-branded) -->
  <g transform="translate(980,180)" opacity="0.85">
    <ellipse cx="120" cy="90" rx="48" ry="52" fill="#EF4444" opacity="0.25"/>
    <path d="M120 140 L70 320 L90 320 L120 200 L150 320 L170 320 Z" fill="url(#accent)" opacity="0.5"/>
    <rect x="60" y="150" width="120" height="28" rx="6" fill="#EF4444" opacity="0.4"/>
    <path d="M40 170 L20 260 L45 260 L70 180 Z" fill="#F97316" opacity="0.45"/>
    <path d="M200 170 L220 260 L195 260 L170 180 Z" fill="#F97316" opacity="0.45"/>
  </g>
  <!-- horizon grid -->
  <g opacity="0.15" stroke="#EF4444" stroke-width="1">
    <line x1="0" y1="620" x2="1600" y2="620"/>
    <line x1="0" y1="680" x2="1600" y2="700"/>
    <line x1="0" y1="740" x2="1600" y2="780"/>
    <line x1="200" y1="600" x2="100" y2="900"/>
    <line x1="500" y1="600" x2="450" y2="900"/>
    <line x1="800" y1="600" x2="800" y2="900"/>
    <line x1="1100" y1="600" x2="1150" y2="900"/>
    <line x1="1400" y1="600" x2="1500" y2="900"/>
  </g>
  <text x="100" y="820" fill="#EF4444" font-family="system-ui,sans-serif" font-size="42" font-weight="700" opacity="0.9">FF</text>
  <text x="100" y="860" fill="#ffffff" font-family="system-ui,sans-serif" font-size="18" opacity="0.35">ASTRAX-VOID</text>
</svg>