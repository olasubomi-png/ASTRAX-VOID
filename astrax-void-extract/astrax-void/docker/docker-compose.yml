version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: astrax-void

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ../apps/api
      dockerfile: ../../docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mongodb://mongo:27017/astrax-void
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
    depends_on:
      - mongo
      - redis

volumes:
  mongo_data:
  redis_data:
