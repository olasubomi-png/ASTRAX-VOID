# ASTRAX-VOID — Nginx config for EC2 public IP (no domain / no SSL)
# Use this while you don't yet have a domain pointed at the server.
# When you get a domain, switch to deploy/nginx.conf and run certbot.
#
# Install:
#   sudo cp deploy/nginx-ip.conf /etc/nginx/sites-available/astrax-void
#   sudo ln -sf /etc/nginx/sites-available/astrax-void /etc/nginx/sites-enabled/astrax-void
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

# Rate limiting zones (defined in http context — must be at top level)
limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Catch-all: works with EC2 public IP and any hostname
    server_name _;

    # Logging
    access_log /var/log/nginx/astrax-access.log;
    error_log  /var/log/nginx/astrax-error.log;

    # Security headers (no HSTS — HTTP only for now)
    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection       "1; mode=block"                 always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Max body size (product image uploads etc.)
    client_max_body_size 60G;
    client_body_timeout 3600s;

    # ── Auth endpoints — strict rate limiting ────────────────────────────────
    # Must be declared BEFORE the generic /api/ block (more specific wins)
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }

    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── API routes → Express on :4000 ───────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }

    # ── Health check — no rate limit ─────────────────────────────────────────
    location = /health {
        proxy_pass       http://127.0.0.1:4000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        access_log off;
    }

    # ── Next.js static assets — long cache ───────────────────────────────────
    location /_next/static/ {
        proxy_pass       http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires          1y;
        add_header       Cache-Control "public, immutable";
    }

    # ── Next.js frontend → :3000 ─────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }
}
